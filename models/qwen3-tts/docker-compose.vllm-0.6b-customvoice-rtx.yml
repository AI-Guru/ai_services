# Qwen3-TTS-12Hz-0.6B-CustomVoice — vLLM-Omni online serving (RTX PRO 6000)
#
# Lightweight 0.6B sibling of the 1.7B CustomVoice model — same 9 preset voices
# and OpenAI /v1/audio/speech API, smaller talker (~1.2 GB) for lower footprint
# and higher throughput at a small quality cost. Best pick when packing many
# TTS voices onto the shared card.
#
# MEMORY: extra-conservative — deploy/qwen3_tts-0.6b-conservative.yaml pins each
# stage to gpu_memory_utilization 0.05, enforce_eager, max_num_seqs 4
# (~9.6 GB total for both stages).
#
# Usage: docker compose -f docker-compose.vllm-0.6b-customvoice-rtx.yml up -d
# API endpoint: http://localhost:12440/v1   model name: qwen3-tts-0.6b-customvoice

services:
  qwen3tts-0.6b-customvoice:
    image: vllm/vllm-omni:v0.22.0
    container_name: qwen3tts-0.6b-customvoice
    restart: unless-stopped

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ipc: host
    dns:
      - 8.8.8.8
      - 8.8.4.4
    shm_size: 32gb

    ulimits:
      memlock: -1
      stack: 67108864

    ports:
      - "12440:12440"

    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - ./deploy:/deploy:ro

    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

    command:
      - vllm
      - serve
      - Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
      - --omni
      - --task-type
      - CustomVoice
      - --deploy-config
      - /deploy/qwen3_tts-0.6b-conservative.yaml
      - --served-model-name
      - qwen3-tts-0.6b-customvoice
      - --trust-remote-code
      - --host
      - 0.0.0.0
      - --port
      - "12440"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12440/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  huggingface_cache:
    name: qwen3tts_huggingface_cache

networks:
  default:
    name: qwen3tts-network
