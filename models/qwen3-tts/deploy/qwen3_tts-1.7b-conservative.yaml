# Qwen3-TTS 1.7B — CONSERVATIVE two-stage deploy (talker → code2wav).
#
# Derived from the image-shipped vllm_omni/deploy/qwen3_tts.yaml, retuned so
# several TTS containers (and the heavy qwen3.6 LLMs) can coexist on one card.
# Changes vs. the stock config:
#   * gpu_memory_utilization 0.3 -> 0.07 PER STAGE  (~6.7 GB/stage of a 96 GB
#     card; two stages ≈ 13.4 GB total per model). This is a FRACTION OF TOTAL
#     card memory, and each stage is a separate vLLM engine, so the two add up.
#   * max_num_seqs 10 -> 4 (low concurrency; small KV pool = small footprint).
#   * enforce_eager true on BOTH stages — skips cudagraph capture to save the
#     most memory. Costs some decode speed, not quality. Drop it (and raise
#     gpu_memory_utilization) if you run this model solo and want throughput.
# Everything else (connectors, batched-token / model-len sizing, sampling) is
# kept identical to the vendor config — those values are correctness-critical.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 1
      decode_cudagraph_capture_sizes: [25, 73, 97, 169, 325]

stages:
  - stage_id: 0
    max_num_seqs: 4
    gpu_memory_utilization: 0.07
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: true
    async_scheduling: true
    max_num_batched_tokens: 512
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    max_num_seqs: 4
    gpu_memory_utilization: 0.07
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.0
