# DeepSeek-V4-Flash-0731 — 284B-total / 13B-active MoE, 256K context
#
# Serving-oriented sibling of docker-compose.vllm-284b-mxfp4-1m-rtx.yml.
# Matches the 262144 context the Qwen3.6 family already serves customers on.
#
# Checkpoint: deepseek-ai/DeepSeek-V4-Flash-0731 (MIT). First-party weights,
# natively mixed precision — MoE expert weights are stored FP4 (MXFP4), while
# attention / norms / router stay FP8 block-wise (128x128, ue8m0 scales).
# 166.9 GB / 155.4 GiB on disk. No community quant involved.
#
# Architecture: 43 layers, 256 routed experts (6 routed + 1 shared per token),
# hybrid CSA + HCA sparse attention with a Lightning Indexer, manifold-constrained
# hyper-connections (mHC). KV cache is ~10% of V3.2's at 1M context.
#
# REQUIRES 2x RTX PRO 6000 (2x96 GB). Weights alone are 77.7 GiB per GPU at TP=2 —
# this model cannot run on a single card. GPUs are PCIe-linked (no NVLink).
#
# Why this variant exists: to double the prefill batch budget (16384 vs 8192),
# which throttles RAG / summarization / agentic traffic on the 1M variant.
#
# Counterintuitive but measured: 256K does NOT free memory relative to 1M — it
# costs more. Per-token KV cost falls as the declared max length grows (96.0
# KiB/token at 32K, 30.2 at 256K, 6.8 at 1M), because most of the 43 layers run
# 4x or 128x compression that only pays off over long contexts. 256K therefore
# needs 7.55 GiB of KV where 1M needs 6.85 GiB. Utilization stays at 0.94.
#
# Two deliberate deviations from the family conventions, both load-bearing:
#   1. Custom image (Dockerfile.vllm-sm120) — stock v0.25.0 ships a FlashInfer
#      too old for the DeepSeek-V4 sparse-MLA decode path on SM120.
#   2. Bind-mounts the HOST HuggingFace cache instead of a named volume — the
#      checkpoint is 167 GB and is already present at ~/.cache/huggingface.
#      A named volume would re-download it.
#
# Mutually exclusive with the 1M variant: both claim all GPUs and port 11437.
#
# Usage: docker compose -f docker-compose.vllm-284b-mxfp4-256k-rtx.yml up -d
# API endpoint: http://localhost:11437/v1
# Model name served as: deepseek-v4-flash

services:
  deepseek-v4-flash-256k:
    build:
      context: .
      dockerfile: Dockerfile.vllm-sm120
    image: vllm-dsv4-sm120:0.25.0
    container_name: deepseek-v4-flash-256k
    restart: unless-stopped

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ipc: host
    dns:
      - 8.8.8.8
      - 8.8.4.4

    ulimits:
      memlock: -1
      stack: 67108864

    ports:
      - "11437:11437"

    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface

    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      # Host has 62 GB RAM vs a 155 GiB checkpoint, so vLLM disables weight
      # auto-prefetch and streams shards via mmap. Load takes ~40s; that is normal.
      - VLLM_ENGINE_READY_TIMEOUT_S=3600
      # NOTE: PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True is deliberately NOT
      # set. The rest of the family uses it, but this config was verified without
      # it and expandable_segments interacts with CUDA graph capture.

    command:
      - deepseek-ai/DeepSeek-V4-Flash-0731
      - --served-model-name
      - deepseek-v4-flash
      - --host
      - "0.0.0.0"
      - --port
      - "11437"
      - --trust-remote-code
      - --tensor-parallel-size
      - "2"
      - --enable-expert-parallel
      - --max-model-len
      - "262144"
      # 0.94, same as the 1M variant — NOT because 256K needs less memory, but
      # because it needs MORE. This model's per-token KV cost falls as the
      # declared max length grows (96.0 KiB/token at 32K, 30.2 at 256K, 6.8 at
      # 1M), so 256K demands 7.55 GiB of KV against 1M's 6.85 GiB. At 0.92 with
      # the 16384 batch budget below, only 7.08 GiB was available and the engine
      # refused to start (estimated max length 139,520). 0.97 OOMs during CUDA
      # graph capture. 0.94 is the working point.
      - --gpu-memory-utilization
      - "0.94"
      # Mandatory: DSv4's fp8_ds_mla attention asserts an FP8 KV layout.
      - --kv-cache-dtype
      - fp8
      - --block-size
      - "256"
      # max-num-seqs held equal to the 1M variant so concurrency sweeps compare.
      # max-num-batched-tokens is 2x the 1M variant — the whole point of 256K.
      - --max-num-seqs
      - "256"
      - --max-num-batched-tokens
      - "16384"
      - --tokenizer-mode
      - deepseek_v4
      - --reasoning-parser
      - deepseek_v4
      - --tool-call-parser
      - deepseek_v4
      - --enable-auto-tool-choice
      # NOTE: no --speculative-config. The checkpoint ships DSpark
      # (dspark_block_size=5), but speculative decoding is unavailable on SM120 in
      # stock vLLM: MTP and DSpark both abort in warmup with
      # `Check failed: num_tokens > 64` from sparse_mla_sm120_paged_attention.
      # Needs vllm PR #41834.

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11437/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Cold start is ~4 min: ~40s weight load, TileLang mHC kernel compile,
      # SM120 sparse-MLA autotune, then ~60s CUDA graph capture.
      start_period: 420s

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

networks:
  default:
    name: deepseek-v4-flash-network
