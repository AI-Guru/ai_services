# Qwen3.8-27B NVFP4 W4A4 (gittensor-model-hub) — no speculation
#
# WHY THIS CHECKPOINT EXISTS ALONGSIDE THE UNSLOTH ONE:
# It is a genuinely different quantization, not a repack. Read
# hf_quant_config.json on both before assuming they are interchangeable:
#
#   unsloth/Qwen3.8-27B-NVFP4     compressed-tensors MIXED_PRECISION.
#                                 4-bit weights on mlp.{gate,up,down}_proj ONLY,
#                                 16-bit activations. Attention, DeltaNet gates
#                                 and layers 56-63's MLPs stay FP8. 23.44 GB.
#
#   gittensor .../NVFP4-RTX5090   modelopt NVFP4 W4A4, group_size 16,
#                                 targets ["Linear"] — 4-bit WEIGHTS *and*
#                                 4-bit ACTIVATIONS across the whole language
#                                 model. Only lm_head, embeddings, the DeltaNet
#                                 conv1d/in_proj_a/in_proj_b, the vision tower
#                                 and the MTP head are excluded.
#
# W4A4 is the point. On sm_120 the FP4 tensor cores only engage when the
# activations are FP4 too; a W4A16 checkpoint dequantizes to 16-bit and runs the
# GEMM at 16-bit, so it buys VRAM but not math throughput. That is the most
# likely explanation for the Unsloth checkpoint's mediocre 58.7 tok/s.
#
# ⚠️ COMMUNITY QUANT, and an unusual one — the repo name says RTX5090 because it
# was calibrated and benchmarked on a 32 GB 5090, not on this card. Nothing in
# the checkpoint is 5090-specific (sm_120 is sm_120), but their serving advice
# IS: they mandate --gpu-memory-utilization 0.97 because 0.90 "only holds ~205k
# KV" on 32 GB. On 96 GB that is irrelevant — do NOT copy that flag, it only
# raises OOM risk here. This file leaves it at the vLLM default 0.90.
#
# ⚠️ TWO QUANT CONFIGS IN ONE REPO. It ships BOTH hf_quant_config.json (modelopt
# producer) AND a compressed-tensors `quantization_config` inside config.json,
# describing the same weights via two different vLLM code paths. Their card says
# `--quantization modelopt`. This file passes NO --quantization flag and lets
# vLLM auto-detect, because auto-detect reads config.json and picks
# compressed-tensors. If you change this, change it deliberately and re-measure:
# it is a kernel-selection change, not a cosmetic one. Verify which path took
# with:
#   docker logs qwen38-27b-nvfp4-gittensor 2>&1 | grep -iE 'quant|kernel'
#
# Published numbers on a 5090 32 GB (their card, sglang): 80.6 tok/s no-spec,
# 136.90 with the built-in MTP head, 147.87 with their DSpark NVFP4 drafter.
# Baseline to beat here, Unsloth NVFP4 no-spec on this card: 58.7 tok/s.
#
# Everything below this line is byte-identical to
# docker-compose.vllm-27b-nvfp4-unsloth-rtx.yml except the model id and the
# container name, so the delta against it is attributable to the checkpoint.
#
# Usage: docker compose --env-file ../../.env -f docker-compose.vllm-27b-nvfp4-gittensor-rtx.yml up -d
# API endpoint: http://localhost:11484/v1   Model name: qwen3.8-27b

services:
  qwen38-27b-nvfp4-gittensor:
    image: vllm/vllm-openai:qwen38-x86_64-cu130
    container_name: qwen38-27b-nvfp4-gittensor
    restart: "no"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ipc: host
    dns: ["8.8.8.8", "8.8.4.4"]
    shm_size: 64gb

    ulimits:
      memlock: -1
      stack: 67108864

    ports:
      - "11484:8000"

    volumes:
      - huggingface_cache:/root/.cache/huggingface

    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - VLLM_USE_FLASHINFER_SAMPLER=0

    command:
      - gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090
      - --served-model-name
      - qwen3.8-27b
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "262144"
      - --kv-cache-dtype
      - fp8
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  huggingface_cache:
    name: qwen38_huggingface_cache

networks:
  default:
    name: qwen38-network
