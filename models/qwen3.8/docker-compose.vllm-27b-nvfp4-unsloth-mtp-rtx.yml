# Qwen3.8-27B-NVFP4 (Unsloth) + MTP speculative decoding
#
# ============ VERIFIED 97.9 tok/s — SUPERSEDED 2026-08-18 ===============
# This was the production endpoint. It is now THIRD; see README.md's throughput
# table. docker-compose.vllm-27b-nvfp4-gittensor-dspark-rtx.yml serves 111.8
# tok/s on the same port and served-model-name.
#
# Kept because it is one half of two controlled A/Bs that produced the result:
#   vs ...-unsloth-rtx.yml       (same checkpoint, no MTP)   -> what MTP is worth
#   vs ...-gittensor-mtp-rtx.yml (same MTP depth, W4A4)      -> what W4A4 is worth
# The second one is the surprising one: on the FASTER W4A4 target the same MTP
# depth scores LOWER (95.9), because a harder-quantized target diverges further
# from its own BF16 draft head. Do not "modernise" this file to the newer
# checkpoint — that would destroy the comparison.
# ========================================================================
#
# The MTP head is REAL here, not just a config claim: this checkpoint's
# model.safetensors.index.json maps 15 `mtp.*` tensors (mtp.fc.weight +
# mtp.layers.0.*) into a dedicated model_mtp.safetensors (0.85 GB). Because the
# file IS referenced from the index, vLLM already loads those weights during
# normal startup even with speculation off — enabling MTP therefore costs no
# extra download and no extra weight VRAM, only the draft/verify compute.
#
# !! THE REASON TO BE SKEPTICAL OF THIS PARTICULAR COMBINATION:
# Unsloth's quantization config excludes the head (`re:^mtp.*` in `ignore`), so
# the drafter stays BF16 while the target it drafts for is 4-bit NVFP4. That is
# the WIDEST drafter/target precision mismatch of any checkpoint in this
# directory. On Qwen3.6 exactly this kind of divergence broke speculation:
# DFlash was stable on FP8 targets and unstable on INT4, because the drafter had
# been trained against BF16 targets. A BF16 drafter proposing tokens for a 4-bit
# model may simply have a poor acceptance rate — in which case MTP costs
# throughput rather than adding it, since every rejected draft is wasted verify
# compute.
#
# By contrast Qwen's own FP8 checkpoint quantizes its head too (22 mtp tensors
# incl. weight_scale_inv), giving matched drafter/target precision. If you are
# choosing ONE MTP experiment to run, run
# docker-compose.vllm-27b-fp8-mtp-rtx.yml first — it is the better-conditioned
# one, even though NVFP4 is the faster non-MTP baseline.
#
# So the interesting question this file answers is not "is MTP faster" but
# "does a mismatched-precision drafter still pay for itself". A NEGATIVE result
# here is a real finding worth writing down, not a failed experiment.
#
# !! Do NOT copy an MTP depth from ../qwen3.6/. Measured there: the optimum did
# not transfer between the 27B (dense, N=4) and 35B (MoE, N=3) of the SAME
# generation, and it flips between prose and code workloads (~2x spread).
# test_chat.py's default prompt is close to spec-decode's worst case. Sweep
# num_speculative_tokens 2 -> 5 on the workload you actually serve.
#
# !! vLLM VERSION: MTP needs vLLM 0.27.2+ for the gated-delta-net speculative
# fix (plain serving is fine on 0.27.1). The qwen38 image reports
# 0.1.dev19754+g3a0914114 / transformers 5.15.0, which satisfies it. Do NOT
# "downgrade to stable" for this file.
#
# !! VISION IS ENABLED (no --language-model-only, matching the verified
# baseline). On 3.6, MTP crashed the engine on mixed-modality batches and on
# batched long sequences. Both may or may not be fixed in this build — assume
# nothing. If the engine dies on an image request, that is the first suspect:
# add --language-model-only to confirm, and report the result as text-only-MTP
# rather than quietly serving a degraded endpoint.
#
# Community quant — see the baseline file's header for the full scheme
# (compressed-tensors mixed-precision, 4-bit FFNs only, NOT modelopt, so no
# --quantization flag). The official vLLM recipe prefers
# Inferact/Qwen3.8-27B-NVFP4; this tracks the Unsloth checkpoint that is
# actually verified working here.
#
# PORT 11484 and --served-model-name qwen3.8-27b, same as every other vLLM
# config here, so this is a drop-in swap for existing harnesses. Only one can
# run at a time on this card — stop the other first, and confirm before
# stopping anything being served live.
#
# Baseline to beat, same checkpoint without MTP: 58.7 tok/s (test_chat.py
# --runs 3 --warmup, 58.4/58.6/59.0 across runs), tools 4/4,
# KV pool 1,899,790 tokens, weights 21.18 GiB.
#
# Usage: docker compose --env-file ../../.env -f docker-compose.vllm-27b-nvfp4-unsloth-mtp-rtx.yml up -d
# API endpoint: http://localhost:11484/v1
# Model name served as: qwen3.8-27b

services:
  qwen38-27b-nvfp4-unsloth-mtp:
    image: vllm/vllm-openai:qwen38-x86_64-cu130
    container_name: qwen38-27b-nvfp4-unsloth-mtp
    # "no" since 2026-08-18: this WAS the production endpoint (97.9 tok/s) and
    # is no longer — docker-compose.vllm-27b-nvfp4-gittensor-dspark-rtx.yml
    # serves 111.8 tok/s on the same port with the same served-model-name.
    # Two composes with restart: unless-stopped on port 11484 would fight each
    # other for the card on every boot, so only the production one keeps it.
    #
    # Retained as provenance for the W4A16-vs-W4A4 and MTP-vs-DSpark results:
    # this checkpoint's SOFTER quantization gives its BF16 MTP head a better
    # acceptance rate (2.19 / 59.4%) than the faster W4A4 target does
    # (~1.9 / 38-55%), which is the whole reason MTP looked good here first.
    #
    # The crash-loop risk this originally guarded against is real — see
    # CLAUDE.md — so if you edit the command below, watch the first boot with
    # the crash-loop-aware waiter rather than a naive "wait until healthy" loop,
    # which hangs until timeout instead of reporting the failure.
    restart: "no"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ipc: host
    dns: ["8.8.8.8", "8.8.4.4"]
    shm_size: 64gb

    ulimits:
      memlock: -1
      stack: 67108864

    ports:
      - "11484:8000"

    volumes:
      - huggingface_cache:/root/.cache/huggingface

    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - VLLM_USE_FLASHINFER_SAMPLER=0

    command:
      - unsloth/Qwen3.8-27B-NVFP4
      - --served-model-name
      - qwen3.8-27b
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      # --- identical to docker-compose.vllm-27b-nvfp4-unsloth-rtx.yml ---
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "262144"
      - --kv-cache-dtype
      - fp8
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      # --- the only addition ---
      # Method and depth from the official vLLM recipe. Sweep the depth
      # (2 -> 5) before settling — see header.
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":2}'

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  huggingface_cache:
    name: qwen38_huggingface_cache

networks:
  default:
    name: qwen38-network
