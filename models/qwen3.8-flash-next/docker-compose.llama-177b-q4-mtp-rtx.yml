# Qwen3.8-Flash-Next (qwen4exp) UD-Q4_K_XL + MTP + Vision via llama.cpp — RTX PRO 6000
#
# Speculative decoding variant of docker-compose.llama-177b-q4-rtx.yml. Same
# model, same --lazy-mode, plus the NextN/MTP draft head: the head guesses the
# next few tokens and the main model verifies them in one pass. Verification is
# exact, so output is unchanged — only speed.
#
# ⚠️ REQUIRES #28243, NOT PLAIN MAINLINE llama.cpp.
#   As of 2026-09-13 master still has no MTP graph for qwen4exp: #28243 (the
#   MTP PR this build carries) is an open draft, #27836/#28097 are open,
#   #28104/#27842/#27956 were dropped. Mainline accepts
#   --spec-type draft-mtp (it exists for other archs) and then SILENTLY IGNORES
#   the head — you get baseline speed and no error. Always confirm speculation
#   actually ran by looking for this line in the log:
#     draft acceptance = 0.73939 (610 accepted / 825 generated), mean len = 2.48
#   No acceptance line = no speculation.
#
#   docker build --build-arg LLAMA_REPO=ggml-org/llama.cpp \
#     --build-arg LLAMA_REF=127368d8fbf8d8d9ddbbbf8f5514e1c0db4a70d8 \
#     -t llama.cpp-qwen4exp:mtp-127368d8 \
#     -f models/qwen3.8-flash-next/Dockerfile.llama-qwen4exp \
#     models/qwen3.8-flash-next/
#   127368d8 is GitHub's own merge of #28243 (head 6fcaa16f, 2026-09-21) into
#   master ec5a12b8 (2026-09-22) — build 11112. Pinned by SHA: the
#   refs/pull/28243/merge ref moves whenever master does. Same recipe with
#   c83604f0b gives the previous production build 10945 (tag :mtp-c83604f0).
#
#   Build 11112 vs 10945, A/B 2026-09-22, same flags, ms per forward pass
#   (the acceptance-independent metric — see the README):
#     decode   -3 % at 4K-64K, -4..-8 % at 128K-250K   (fused hc/norm ops)
#     prefill  +21..+40 % at 128K-250K, ~flat below     (#28770 sparse FA —
#              prefill batches reach its 8-column tiles; MTP's 4-token verify
#              batches do not, so decode gets none of it)
#     VRAM     93,861 vs 93,883 MiB — unchanged
#
#   Build 10945 vs the fork's own d1a92352c (build 10802, still tagged
#   llama.cpp-qwen4exp:mtp for rollback), A/B 2026-09-13, same flags:
#     ms per forward pass    within -1.2 .. +3.3 % at every depth 2K-250K
#     prefill                within -1.6 .. +1.0 %
#     VRAM                   93,883 vs 95,419 MiB  -> 1.5 GiB freed
#   Speed-neutral; the rebase is a VRAM win (#28330 stops the QSA indexer
#   allocating a V cache it never reads). Details in the README.
#
#   d1a92352c itself was worth +4 to +8 % over the unslothai PR #144 build
#   (586b15ef8) — entirely in the MTP path, the non-MTP baseline is unchanged
#   (96.07 vs 95.53 tok/s greedy).
#
# DRAFT HEAD (2.60 GiB) — the `shared-` variant borrows token embedding and
# output projection from the main model, saving ~1.3 GB over the self-contained
# file. Needs a build with borrowing support, which the fork has.
#   hf download unsloth/Qwen3.8-Flash-Next-GGUF \
#     --local-dir /home/despara/models/qwen3.8-flash-next --include "MTP/*shared-Q8_0*"
#
# MEASURED 2026-09-06 (this card, d1a92352c, n-max 3, 1024-token generations):
#   temp 1.0 / top-p 0.95   98.20 -> 136.67 tok/s  (1.39x)  <- the real setting
#   greedy (temp 0)         96.07 -> 142.87 tok/s  (1.49x)
#   draft acceptance 57.8 %
#   Unsloth's guide claims 170 tok/s on a 1x RTX PRO 6000 against a "100
#   baseline". Our baseline matches theirs (96-99); the MTP figure does not —
#   we are ~19 % short even greedy. What differs is not stated in their docs.
#
# COST (builds 10945/11112): 91.7 GiB of 95.6 with the vision projector — 3.9 GiB
# of headroom, up from 2.4 on build 10802 (nvidia-smi 93,883 vs 95,419 MiB idle).
# The draft head is 2.6 GiB and its own KV cache another ~1.7; the projector
# adds ~1.1. Still the tightest config here, and the per-image buffers under
# CONCURRENT vision requests were never measured.
# If you do not need images, drop the two --mmproj lines to free another ~1.1 GiB.
#
# Verified working: vision and MTP do not disable each other — an image request
# answered correctly while the log still showed draft acceptance = 0.58743.
#
# ⚠️ SINGLE STREAM ONLY. Unsloth measure MTP as a net LOSS (~0.81-0.87x) at
#   concurrency 8: a busy model has no idle capacity for a draft to exploit.
#   Use the non-MTP compose for multi-user serving.
#
# Serves on the SAME port as docker-compose.llama-177b-q4-rtx.yml — only one
# model fits this card, so the two are mutually exclusive. Run one at a time.
#
# Usage: docker compose -f docker-compose.llama-177b-q4-mtp-rtx.yml up -d
# API:   http://localhost:11480/v1     served as: qwen3.8-flash-next

services:
  qwen38-flashnext-q4-mtp-rtx:
    image: llama.cpp-qwen4exp:mtp-127368d8
    container_name: qwen38-flashnext-q4-mtp-rtx
    # `always` — this file IS production now, so it is the one that has to come
    # back after a reboot. gpu-safe-shutdown.service `docker stop`s every GPU
    # container before poweroff, and `docker stop` cancels an `unless-stopped`
    # policy for good, leaving the model down across the reboot. Exactly that
    # happened on 2026-09-06/07: this compose still carried `unless-stopped`
    # from when the non-MTP file was production, and after the 11:35 reboot
    # nothing came back.
    #
    # Only ONE of the two composes may carry `always` — both bind port 11480 and
    # would otherwise fight on boot. Whichever is production owns `always`; the
    # other must be `unless-stopped`. Swap BOTH when switching.
    restart: always

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ulimits:
      memlock: -1
      stack: 67108864

    ports:
      - "11480:11480"

    volumes:
      - /home/despara/models/qwen3.8-flash-next:/models:ro

    command:
      - -m
      - /models/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
      - --mmproj
      - /models/mmproj-F16.gguf
      - -md
      - /models/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
      - --spec-type
      - draft-mtp
      # 3, MEASURED — not the 5 that Unsloth's MTP guide recommends. On this
      # card 5 is slower than 2, and 8 is a net LOSS against running no MTP at
      # all. Acceptance is what decides it: it falls off a cliff as n-max rises,
      # and past ~3 you throw away more drafts than you win.
      #
      #   n-max   greedy   temp 1.0   acceptance   factor vs no-MTP (t1.0)
      #     2     139.18    135.73      67.7 %          1.38x
      #     3     142.87    136.67      57.8 %          1.39x   <- best
      #     5     116.64    117.50      43.9 %          1.20x
      #     8      96.31     93.33      31.6 %          0.95x   <- slower than off
      - --spec-draft-n-max
      - "3"
      - -ngl
      - "99"
      - -c
      - "262144"
      - --lazy-mode
      - "on"
      - --host
      - "0.0.0.0"
      - --port
      - "11480"
      - -a
      - qwen3.8-flash-next

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11480/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

networks:
  default:
    name: qwen38-flashnext-network
