# Qwen3.6-27B FP8 (W8A8, block-wise 128x128) + MTP speculative decoding
# Hardware: NVIDIA H100 NVL 94 GB (GH100, Hopper, SM_90)
#
# ★ RECOMMENDED DEFAULT for Qwen3.6-27B on this host.
#
# Identical to docker-compose.vllm-27b-fp8-h100.yml except for the added
# --speculative-config. Everything else — image, checkpoint, context, util,
# max-num-seqs — is held constant so the delta is attributable to MTP alone.
#
# MTP = Multi-Token Prediction. Qwen3.6-27B ships native MTP draft-head weights
# INSIDE the FP8 checkpoint (verified: 22 `mtp.*` tensors in
# model.safetensors.index.json, including mtp.fc.weight and the mtp.layers.0.*
# block with matching weight_scale_inv entries, i.e. the head is FP8-quantised
# too). No external drafter model is required.
#
# num_speculative_tokens=1, not 2 or 3, on purpose:
#   Qwen3.6's hybrid Gated DeltaNet carries a recurrent state that cannot be
#   restored on a PARTIAL accept, so acceptance gains saturate at N=1 on this
#   architecture. The 35B-A3B MoE sibling runs N=3, but it is a different
#   (non-recurrent-bottlenecked) tradeoff. Treat N=2 as an untested sweep knob:
#   if you try it, verify output coherence, not just tok/s.
#
# Expected gain: MTP is worth much more on the DENSE 27B than on the 35B MoE.
# On RTX PRO 6000 the same flag moved FP8 from 47.0 -> 66.2 tok/s (+41%), because
# the dense forward pass is ~9x more expensive than the MoE's 3B active params,
# so there is far more per-step cost for the draft+verify batch to amortise.
# That argument is hardware-independent and should carry to Hopper.
#
# Caveat carried over from the -rtx measurements: on SHORT generations (~64
# tokens) MTP measured slightly NEGATIVE (-13%) — draft+verify overhead is not
# amortised. It wins on long generations, which dominate this thinking model's
# workload. Benchmark with a realistic output length, not a 64-token reply.
#
# Method name is "qwen3_next_mtp" (vLLM's internal name for this head), NOT the
# generic "mtp". Using "mtp" here will fail to resolve the drafter.
#
# KV cache stays BF16/auto (--kv-cache-dtype fp8_e4m3 omitted; DeltaNet #26646).
#
# VISION: ENABLED (multimodal — text + image + video).
# vLLM loads the checkpoint's vision tower by default; `--language-model-only`
# would suppress it. That flag is deliberately ABSENT here.
#   - The Unsloth chat template already carries the vision markers
#     (vision_start / image_pad / vision_end / image_url), so multimodal messages
#     render correctly. Do NOT drop --chat-template for vision — the checkpoint's
#     native template has the known issues this repo's template exists to fix.
#   - Cost is ~1.5 GB VRAM for the encoder, taken out of the KV pool. The README
#     measured vision as negligible overhead for pure-text throughput.
#   - Add `--language-model-only` back for a text-only A/B.
# NOTE: the published H100 benchmark numbers were measured TEXT-ONLY, before this
# flag was removed; decode throughput should be unchanged, KV pool ~1.5 GB smaller.
#
# Usage: docker compose -f docker-compose.vllm-27b-fp8-mtp-h100.yml up -d
# API endpoint: http://localhost:11436/v1  ·  model: qwen3.6-27b
# No HF_TOKEN needed — this checkpoint is public and ungated.

services:
  qwen36-27b-fp8-mtp-h100:
    image: vllm/vllm-openai:v0.26.0-cu129
    container_name: qwen36-27b-fp8-mtp-h100
    restart: unless-stopped

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ipc: host
    dns: ["8.8.8.8", "8.8.4.4"]
    shm_size: 64gb

    ulimits:
      memlock: -1
      stack: 67108864

    ports:
      - "11436:11436"

    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - ./qwen3.6_unsloth_chat_template.jinja:/chat_template.jinja:ro

    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN
      - VLLM_USE_FLASHINFER_SAMPLER=0

    command:
      - Qwen/Qwen3.6-27B-FP8
      - --served-model-name
      - qwen3.6-27b
      - --host
      - "0.0.0.0"
      - --port
      - "11436"
      - --max-model-len
      - "262144"
      - --gpu-memory-utilization
      - "0.90"
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-seqs
      - "256"
      - --max-num-batched-tokens
      - "16384"
      - --chat-template
      - /chat_template.jinja
      - --speculative-config
      - '{"method":"qwen3_next_mtp","num_speculative_tokens":1}'

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11436/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  huggingface_cache:
    name: qwen36_huggingface_cache

networks:
  default:
    name: qwen36-network
