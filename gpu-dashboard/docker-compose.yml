# GPU Monitoring Dashboard — Grafana + Prometheus + nvidia_gpu_exporter
#
# Fully local, no cloud dependency.
# Parses nvidia-smi XML output — works with any NVIDIA GPU including Blackwell.
#
# Usage: docker compose up -d
# Dashboard: http://localhost:3000 (no login required)
# Prometheus: http://localhost:9090
# Exporter: http://localhost:9835/metrics

services:
  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.3.0
    container_name: nvidia-gpu-exporter
    # `always`, NOT `unless-stopped`: this container requests GPU devices, so
    # safe-shutdown.sh sweeps it up with the vLLM containers and `docker stop`s
    # it before every poweroff. `unless-stopped` remembers that manual stop
    # across the reboot, which would leave the GPU blind from the next boot on —
    # precisely when you reboot to recover from an Xid and most need the history.
    # `always` restarts it when the daemon comes back regardless. It only scrapes
    # nvidia-smi (no CUDA context), so it is never the thing that wedges the card.
    restart: always
    pid: host
    ports:
      - "9835:9835"
    volumes:
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
    command:
      - --query-field-names=name,uuid,fan.speed,pstate,memory.total,memory.used,memory.free,utilization.gpu,utilization.memory,temperature.gpu,power.draw,power.limit,clocks.current.graphics,clocks.current.sm,clocks.current.memory,clocks.current.video,pcie.link.gen.current,pcie.link.width.current
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Complements nvidia-gpu-exporter rather than replacing it. That one samples
  # instantaneous values every 5s; this one exports CUMULATIVE event counters and
  # PCIe AER counters, which retain transients shorter than the scrape interval.
  # See the module docstring in gpu-events-exporter.py for why that distinction
  # matters for the Xid 79 investigation.
  gpu-events-exporter:
    image: python:3.12-slim
    container_name: gpu-events-exporter
    # `always` for the same reason as nvidia-gpu-exporter — see the note there.
    restart: always
    ports:
      - "9836:9836"
    volumes:
      - ./gpu-events-exporter.py:/app/gpu-events-exporter.py:ro
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
    command: ["python3", "-u", "/app/gpu-events-exporter.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.6.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/gpu.json
      - GF_DISABLE_SANITIZE_HTML=true
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./custom.css:/custom.css:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus_data:
  grafana_data:
