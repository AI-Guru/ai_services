global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: nvidia_gpu
    static_configs:
      - targets: ["nvidia-gpu-exporter:9835"]

  # Cumulative clock-event counters + PCIe AER counters. Separate exporter
  # because these are not available via `nvidia-smi --query-gpu=`.
  - job_name: gpu_events
    static_configs:
      - targets: ["gpu-events-exporter:9836"]

  # Host CPU / memory / filesystem. Not GPU telemetry, but the stack is the
  # natural home for it: one Prometheus API now answers for both the card and
  # the machine around it.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
